<!doctype html>
<html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2003f</title>
<style>
:root{--bg:#f6f4f0;--fg:#1d1b18;--muted:#6b665e;--card:#fff;--line:#e2ddd4;--accent:#8a5a2b}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--fg:#ece8e1;--muted:#9a948a;--card:#211f1c;--line:#34312c;--accent:#d9a066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
header h1{font-size:20px;margin:0 auto 0 0}
header a{color:var(--accent);text-decoration:none}
header input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:200px}
header label{color:var(--muted);font-size:14px}
main{padding:20px;display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0001;display:block}
.card .cap{padding:8px 10px 10px}
.card .d{font-size:15px}
.card .m{font-size:12px;color:var(--muted);margin-top:3px}
.card .d:empty{display:none}
#lb{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;z-index:10}
#lb.on{display:flex}
#lb img{flex:1;min-height:0;object-fit:contain;width:100%;padding:16px 60px 0}
#lb .cap{color:#eee;text-align:center;padding:14px 20px 20px;font-size:18px}
#lb .cap small{display:block;color:#aaa;font-size:13px;margin-top:4px}
#lb button{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:44px;cursor:pointer;padding:10px}
#lb .prev{left:4px}#lb .next{right:4px}
#lb .close{top:28px;right:8px;font-size:32px}
</style></head><body>
<header><h1>2003f</h1><input id="q" type="search" placeholder="Hae kuvatekstistä…"><label><input id="only" type="checkbox"> vain kuvatekstilliset</label><a href="index.html">← Kaikki albumit</a></header>
<main id="grid"></main>
<div id="lb"><img alt=""><div class="cap"></div>
<button class="prev" aria-label="Edellinen">‹</button><button class="next" aria-label="Seuraava">›</button>
<button class="close" aria-label="Sulje">✕</button></div>
<script>
const DATA=[{"name": "20031231-0538.jpg", "thumb": "thumbs/2003f/20031231-0538.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0538.jpg", "desc": "Uudenvuoden vastaanotto Toukolassa", "date": "2003-12-31"}, {"name": "20031231-0542.jpg", "thumb": "thumbs/2003f/20031231-0542.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0542.jpg", "desc": "", "date": "2003-12-31"}, {"name": "20031231-0545.jpg", "thumb": "thumbs/2003f/20031231-0545.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0545.jpg", "desc": "Seppo, Pirjo, Jouko", "date": "2003-12-31"}, {"name": "20031231-0547.jpg", "thumb": "thumbs/2003f/20031231-0547.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0547.jpg", "desc": "Isäntä Seppo kaataa viiniä", "date": "2003-12-31"}, {"name": "20031231-0552.jpg", "thumb": "thumbs/2003f/20031231-0552.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0552.jpg", "desc": "Masa, Marjatta, Asko, Sisko", "date": "2003-12-31"}, {"name": "20031231-0554.jpg", "thumb": "thumbs/2003f/20031231-0554.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0554.jpg", "desc": "Hely, Seppo Pirjo, Jouko, Tarja, Masa, Marjatta", "date": "2003-12-31"}, {"name": "20031231-0556.jpg", "thumb": "thumbs/2003f/20031231-0556.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0556.jpg", "desc": "Jouko, Tarja, Masa, Marjatta", "date": "2003-12-31"}, {"name": "20031231-0559.jpg", "thumb": "thumbs/2003f/20031231-0559.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0559.jpg", "desc": "Eeva, Simppa, Hely, Seppo", "date": "2003-12-31"}, {"name": "20031231-0560.jpg", "thumb": "thumbs/2003f/20031231-0560.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0560.jpg", "desc": "(Hely, Seppo), Pirjo, Jouko, Tarja, Masa, Marjatta", "date": "2003-12-31"}, {"name": "20031231-0568.jpg", "thumb": "thumbs/2003f/20031231-0568.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0568.jpg", "desc": "Eeva", "date": "2003-12-31"}, {"name": "20031231-0572.jpg", "thumb": "thumbs/2003f/20031231-0572.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0572.jpg", "desc": "Tarja", "date": "2003-12-31"}, {"name": "20031231-0573.jpg", "thumb": "thumbs/2003f/20031231-0573.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0573.jpg", "desc": "Tarja ja Masa", "date": "2003-12-31"}, {"name": "20031231-0577.jpg", "thumb": "thumbs/2003f/20031231-0577.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0577.jpg", "desc": "Eeva , Simppa", "date": "2003-12-31"}, {"name": "20031231-0579.jpg", "thumb": "thumbs/2003f/20031231-0579.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0579.jpg", "desc": "Sisko, Kimmo, Eeva, Simppa, Hely, Seppo", "date": "2003-12-31"}, {"name": "20031231-0580.jpg", "thumb": "thumbs/2003f/20031231-0580.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0580.jpg", "desc": "", "date": "2003-12-31"}, {"name": "20031231-0583.jpg", "thumb": "thumbs/2003f/20031231-0583.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0583.jpg", "desc": "Simppa, Hely, Seppo, Pirjo, Jouko", "date": "2003-12-31"}, {"name": "20031231-0584.jpg", "thumb": "thumbs/2003f/20031231-0584.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0584.jpg", "desc": "Masa, Marjatta, Sisko, Kimmo, Eeva, Simppa", "date": "2003-12-31"}, {"name": "20031231-0586.jpg", "thumb": "thumbs/2003f/20031231-0586.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0586.jpg", "desc": "Sisko, Kimmo, Eeva, Simppa, Hely", "date": "2003-12-31"}, {"name": "20031231-0588.jpg", "thumb": "thumbs/2003f/20031231-0588.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0588.jpg", "desc": "Seppo, Pirjo, Jouko, Tarja, Masa", "date": "2003-12-31"}, {"name": "20031231-0589.jpg", "thumb": "thumbs/2003f/20031231-0589.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0589.jpg", "desc": "Asko", "date": "2003-12-31"}, {"name": "20031231-0590.jpg", "thumb": "thumbs/2003f/20031231-0590.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0590.jpg", "desc": "Hely, Seppo, Pirjo, (Sisko)", "date": "2003-12-31"}, {"name": "20031231-0591.jpg", "thumb": "thumbs/2003f/20031231-0591.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0591.jpg", "desc": "Pirjo, Jouko, Tarja", "date": "2003-12-31"}, {"name": "20031231-0595.jpg", "thumb": "thumbs/2003f/20031231-0595.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0595.jpg", "desc": "Tarja, Simppa, Pirjo, Eeva", "date": "2004-01-01"}, {"name": "20031231-0599.jpg", "thumb": "thumbs/2003f/20031231-0599.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0599.jpg", "desc": "Simppa (sulattamassa tinaa), Masa", "date": "2004-01-01"}, {"name": "20031231-0604.jpg", "thumb": "thumbs/2003f/20031231-0604.jpg", "full": "file:///home/koskenni/Pictures/export/2003f/20031231-0604.jpg", "desc": "Tarja, Simppa, Eeva, Seppo, Hely", "date": "2004-01-01"}], MODE="album";
const grid=document.getElementById('grid'), lb=document.getElementById('lb');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let shown=[], cur=0;
function render(){
  const q=(document.getElementById('q')?.value||'').toLowerCase();
  const only=document.getElementById('only')?.checked;
  shown=DATA.filter(p=>(!q||(p.desc+' '+p.name+' '+(p.folder||'')).toLowerCase().includes(q))&&(!only||p.desc));
  grid.innerHTML=shown.map((p,i)=>MODE==='index'
    ? `<a class="card" href="${esc(p.href)}"><img loading="lazy" src="${esc(p.thumb)}" alt=""><div class="cap"><div class="d">${esc(p.folder)}</div><div class="m">${p.count} kuvaa · ${p.described} kuvatekstiä</div></div></a>`
    : `<div class="card" data-i="${i}"><img loading="lazy" src="${esc(p.thumb)}" alt="${esc(p.desc)}"><div class="cap"><div class="d">${esc(p.desc)}</div><div class="m">${esc(p.date)} · ${esc(p.name)}</div></div></div>`).join('');
}
function show(i){cur=(i+shown.length)%shown.length;const p=shown[cur];
  lb.querySelector('img').src=p.full;
  lb.querySelector('.cap').innerHTML=esc(p.desc||'')+`<small>${esc(p.date)} · ${esc(p.name)}</small>`;
  lb.classList.add('on');}
grid.addEventListener('click',e=>{const c=e.target.closest('.card[data-i]');if(c)show(+c.dataset.i)});
lb.querySelector('.prev').onclick=()=>show(cur-1);
lb.querySelector('.next').onclick=()=>show(cur+1);
lb.querySelector('.close').onclick=()=>lb.classList.remove('on');
document.addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;
  if(e.key==='ArrowLeft')show(cur-1);else if(e.key==='ArrowRight')show(cur+1);else if(e.key==='Escape')lb.classList.remove('on');});
document.querySelectorAll('header input').forEach(el=>el.addEventListener('input',render));
render();
</script></body></html>
